<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<title>Cruise Ship 3D</title>
<!-- Rendering: three.js (MIT License, Copyright © 2010-2025 three.js authors). All ship geometry, materials, sky and ocean are procedural. -->
<style>
  :root { --glass: rgba(14, 18, 26, 0.42); --line: rgba(255, 255, 255, 0.13); --ink: rgba(255, 255, 255, 0.8); --accent: #8fd8ff; }
  html, body { margin: 0; height: 100%; background: #05070b; overflow: hidden; overscroll-behavior: none; }
  body { -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: none; }
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; outline: none; cursor: grab; opacity: 0; transition: opacity 1.4s ease; }
  #c:active { cursor: grabbing; }
  body.ready #c { opacity: 1; }
  #loader { position: fixed; left: 50%; top: 50%; width: 180px; height: 2px; margin: -1px 0 0 -90px; border-radius: 2px; overflow: hidden; background: rgba(255,255,255,0.08); transition: opacity 0.8s ease; }
  #loader::after { content: ""; position: absolute; inset: 0; width: 40%; background: linear-gradient(90deg, transparent, var(--accent), transparent); animation: sweep 1.3s ease-in-out infinite; }
  @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
  body.ready #loader { opacity: 0; pointer-events: none; }
  #ui { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; align-items: center; gap: 2px; padding: 6px; border-radius: 22px;
        background: var(--glass); border: 1px solid var(--line); box-shadow: 0 10px 40px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.06);
        backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4);
        opacity: 0; transition: opacity 0.6s ease, transform 0.6s ease; max-width: calc(100vw - 24px); flex-wrap: wrap; justify-content: center; }
  body.ready #ui { opacity: 1; }
  body.ready.idle #ui { opacity: 0; transform: translate(-50%, 10px); pointer-events: none; }
  /* touch screens have no hover to bring the bar back, so it stays tappable and only dims */
  @media (pointer: coarse) { body.ready.idle #ui { opacity: 0.6; transform: translateX(-50%); pointer-events: auto; } }
  .grp { display: flex; gap: 2px; }
  .sep { width: 1px; height: 26px; background: var(--line); margin: 0 5px; }
  #ui button { width: 44px; height: 44px; padding: 0; border: 0; border-radius: 15px; background: transparent; color: var(--ink); cursor: pointer; display: grid; place-items: center;
               transition: background 0.25s ease, color 0.25s ease, box-shadow 0.25s ease, transform 0.15s ease; }
  #ui button:hover { background: rgba(255,255,255,0.09); color: #fff; }
  #ui button:active { transform: scale(0.94); }
  #ui button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #ui button.on { background: rgba(255,255,255,0.17); color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.28); }
  #ui svg { width: 30px; height: 30px; overflow: visible; }
  .hull { fill: currentColor; opacity: 0.62; }
  .mark { fill: #ff6b5e; opacity: 0.9; }
  .cone { fill: var(--accent); opacity: 0.55; }
  .eye { fill: #fff; }
  .ring { fill: none; stroke: #fff; stroke-width: 1; opacity: 0.8; }
  .wave { stroke: var(--accent); stroke-width: 1.4; fill: none; stroke-linecap: round; }
  .fill { fill: currentColor; }
  .stroke { stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  .thin { stroke-width: 1.4; opacity: 0.6; }
  button.mood.on:nth-child(1) { color: #ffd98a; }
  button.mood.on:nth-child(2) { color: #ffab73; }
  button.mood.on:nth-child(3) { color: #b9c8ff; }
  @media (max-width: 620px) {
    #ui { gap: 0; padding: 4px; border-radius: 18px; }
    #ui button { width: 36px; height: 36px; border-radius: 12px; }
    #ui svg { width: 24px; height: 24px; }
    .sep { margin: 0 2px; height: 20px; }
  }
  @media (max-width: 440px) {
    #ui button { width: 40px; height: 38px; }
    #ui svg { width: 28px; height: 28px; }
  }
</style>
