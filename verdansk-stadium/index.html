<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verdansk Stadium</title>
<style>
:root{--glass:rgba(18,22,28,.42);--line:rgba(255,255,255,.14);--ink:#e9edf2;--ink2:rgba(233,237,242,.55);--acc:#f2c46d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#07090c;overflow:hidden;font:0/0 a}
#app{position:fixed;inset:0}
#app canvas{display:block;width:100%;height:100%;outline:none;touch-action:none;cursor:grab}
#app canvas:active{cursor:grabbing}
#loader{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 40%,#161b22 0%,#07090c 70%);transition:opacity 1.2s ease .2s,visibility 0s 1.5s;z-index:10}
#loader.done{opacity:0;visibility:hidden}
#loader .ring{position:relative;width:220px;height:2px;background:rgba(255,255,255,.08);overflow:hidden;border-radius:2px}
#bar{position:absolute;inset:0;background:linear-gradient(90deg,#8e1a22,#f2c46d,#1f4a6e);transform-origin:0 50%;transform:scaleX(0);transition:transform .5s cubic-bezier(.2,.7,.2,1)}
#loader svg{position:absolute;top:calc(50% - 70px);left:calc(50% - 28px);width:56px;height:56px;opacity:.75;animation:spin 3.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#fade{position:fixed;inset:0;background:#05070a;opacity:0;pointer-events:none;transition:opacity .38s ease;z-index:5}
#ui{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;display:flex;gap:6px;align-items:center;padding:7px;border-radius:18px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 18px 50px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08);transition:opacity .9s ease .6s,transform .9s cubic-bezier(.2,.8,.2,1) .6s;z-index:6;max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none}
#ui.show{opacity:1;transform:translate(-50%,0)}
#ui::-webkit-scrollbar{display:none}
#ui .sep{width:1px;height:26px;background:var(--line);margin:0 5px;flex:none}
#ui button{flex:none;width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--ink2);display:grid;place-items:center;cursor:pointer;transition:background .25s,color .25s,transform .2s}
#ui button:hover{background:rgba(255,255,255,.08);color:var(--ink)}
#ui button:active{transform:scale(.94)}
#ui button.on{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
#ui button.on::after{content:"";position:absolute;margin-top:36px;width:4px;height:4px;border-radius:2px;background:var(--acc)}
#ui svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:560px){#ui{bottom:12px;gap:2px;padding:5px}#ui button{width:38px;height:38px}#ui svg{width:20px;height:20px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="fade"></div>
<div id="loader"><svg viewBox="0 0 24 24" fill="none" stroke="#e9edf2" stroke-width="1.2"><ellipse cx="12" cy="12" rx="10" ry="7"/><ellipse cx="12" cy="12" rx="5.5" ry="3.4"/><path d="M2 12h3M19 12h3"/></svg><div class="ring"><div id="bar"></div></div></div>
<nav id="ui" aria-hidden="false">
  <button data-view="0" aria-label="Aerial orbit"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="15" rx="9" ry="4.2"/><ellipse cx="12" cy="15" rx="4.2" ry="1.8"/><path d="M12 3.5v5M9.6 6 12 3.5 14.4 6"/></svg></button>
  <button data-view="1" aria-label="Top down"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="6"/><rect x="8" y="8.5" width="8" height="7" rx="1"/><path d="M12 8.5v7"/></svg></button>
  <button data-view="2" aria-label="Pitch level"><svg viewBox="0 0 24 24"><path d="M2.5 19 7 8h10l4.5 11z"/><path d="M12 8v11"/><ellipse cx="12" cy="13.2" rx="2.4" ry="1.4"/></svg></button>
  <button data-view="3" aria-label="Stand seat"><svg viewBox="0 0 24 24"><path d="M8.5 4.5c-1 0-1.6.8-1.6 1.8V13h9.8"/><path d="M5 13.5h14M8.5 13.5V20M15.5 13.5V20"/></svg></button>
  <button data-view="4" aria-label="Skycam"><svg viewBox="0 0 24 24"><path d="M3 5l9 7 9-7"/><rect x="9.5" y="12" width="5" height="4" rx="1"/><path d="M12 16v2.5M7 21h10"/></svg></button>
  <button data-view="5" aria-label="Street"><svg viewBox="0 0 24 24"><path d="M3 20h18"/><path d="M6 20V9.5a3 3 0 0 1 6 0V20"/><path d="M6 12.5l6-2M6 16l6-2"/><path d="M14 20v-8h6v8"/></svg></button>
  <button data-view="6" aria-label="Cinematic tour"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M10.2 8.6v6.8l5.6-3.4z"/></svg></button>
  <span class="sep"></span>
  <button data-mode="day" aria-label="Day"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg></button>
  <button data-mode="dusk" aria-label="Golden hour"><svg viewBox="0 0 24 24"><path d="M6.5 16a5.5 5.5 0 0 1 11 0"/><path d="M2.5 16h19M5 19.5h14M12 5v2.5M4.8 8.8l1.7 1.7M19.2 8.8l-1.7 1.7"/></svg></button>
  <button data-mode="night" aria-label="Night"><svg viewBox="0 0 24 24"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/></svg></button>
</nav>
